keywords:
  # Matched with word boundaries, case-sensitive
  case_sensitive: [TEE, SGX, TDX, SEV, SEV-SNP]
  # Matched case-insensitively
  case_insensitive:
    - confidential computing
    - confidential compute
    - enclave
    - arm cca
    - remote attestation
    - confidential vm
    - confidential container
    - trusted execution
    # Chinese equivalents, for ByteDance/Volcano Engine postings: confidential
    # computing, trusted execution environment, confidential container/VM,
    # remote attestation
    - 机密计算
    - 可信执行环境
    - 机密容器
    - 机密虚拟机
    - 远程证明

